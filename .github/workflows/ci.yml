name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # The store conformance suite runs against both implementations. Without a
    # real database the Postgres half skips itself, and the two would be free
    # to drift apart in exactly the environment that matters.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tildra
          POSTGRES_PASSWORD: tildra
          POSTGRES_DB: tildra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tildra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TILDRA_TEST_DATABASE_URL: postgres://tildra:tildra@localhost:5432/tildra?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath ./...

  # A binary nobody can check is a binary you have to trust. That matters most
  # for tildra-auditor, whose entire purpose is being run by someone who does
  # not trust the operator — see docs/REPRODUCIBLE_BUILDS.md.
  reproducible-build:
    name: Reproducible server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: server/go.sum
      - name: Build twice from different paths and compare
        run: ./scripts/reproduce.sh
        working-directory: server
      # Cross-compiling proves the output depends on the declared target and
      # not on the host it was built on.
      - name: Same, cross-compiled for linux/arm64
        run: ./scripts/reproduce.sh linux arm64
        working-directory: server

  # The JavaScript bundle is where all the cryptography actually lives, so it
  # is the half of the app most worth being able to check against the source.
  # The native shell still cannot be — docs/REPRODUCIBLE_BUILDS.md says so.
  reproducible-bundle:
    name: Reproducible app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - name: Build twice from different paths and compare
        run: ./scripts/reproduce.sh ios
        working-directory: mobile
      - name: Same, for Android
        run: ./scripts/reproduce.sh android
        working-directory: mobile
      # Generating the native projects is upstream of compiling them. If this
      # were non-deterministic, no work on Xcode or Gradle afterwards could
      # produce a reproducible app.
      - name: Native projects generate identically
        run: ./scripts/reproduce-native.sh all
        working-directory: mobile

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: server/go.sum
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
        working-directory: server

  mobile:
    name: React Native client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # The client suite includes an end-to-end test that builds and runs the
      # real Go server. Without Go it silently skips, and the wire format
      # between the two halves would drift unnoticed.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: server/go.sum

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Typechecking does not prove the app bundles: a missing native module
      # or an unresolvable import only shows up when Metro walks the graph.
      - name: Bundle
        run: npm run bundle

  # The crypto core is the part where a silent regression is most expensive, so
  # it runs its own job against the published test vectors rather than hiding
  # inside the general test run.
  crypto-vectors:
    name: Crypto test vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run test:vectors
